# Breeze TTS 2 voice server for the EPUB reader's "Server voice" (https://github.com/jskenney/epub-reader).
#
#   1. Download the model weights (about 7.3 GB, research / non-commercial licence):
#        hf download BreezeBlue/Breeze-TTS-2 --local-dir models/Breeze-TTS-2
#   2. Build and start (the first build compiles FlashAttention and takes a while):
#        docker compose up -d --build
#   3. On your web server, proxy /tts/ to http://<this host>:7860/, /tts-voices/ to http://<this host>:7861/voices/
#      and /tts-studio/ to http://<this host>:7861/ (see nginx.conf.example / Caddyfile.example).
#   4. Open https://<your site>/tts-studio/ to try text and create voices.
#
# Needs the NVIDIA Container Toolkit. The API listens on port 7860 on all interfaces (0.0.0.0).
services:
  breeze-tts:
    build:
      # Upstream source, pinned to the commit this setup was written against.
      context: https://github.com/breezeblue-ai/breeze-tts.git#daa6cb2efe5471f09369229f322d20bb956cb3c3
      dockerfile: docker/Dockerfile
      args:
        # GPU architecture for FlashAttention: 120 = Blackwell workstation/consumer (RTX PRO 4000/6000
        # Blackwell, RTX 50xx), 90 = H100, 89 = RTX 40xx / L4, 80 = A100.
        FLASH_ATTN_CUDA_ARCHS: "120"
    image: breeze-tts:sm120
    command: ["python", "-m", "breeze_infer.api", "/models/breeze", "--host", "0.0.0.0", "--port", "7860",
              # CUDA graphs for every stage (fastest). Graphs are captured at start-up for the prompt
              # lengths listed in fast-reader.json (mounted below over upstream's configs/fast.json, which
              # stops at 256 tokens and fails on long paragraphs plus a reference clip).
              "--fast-all"]
    ports:
      - "7860:7860"
    volumes:
      - ${BREEZE_MODEL_DIR:-./models/Breeze-TTS-2}:/models/breeze:ro
      # Warmup profile with prompt lengths up to 1024 tokens (prefill) and 512 (text encoder) at cfg 1.
      - ./fast-reader.json:/opt/breeze-infer/configs/fast.json:ro
    ipc: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]   # inside the container
      interval: 30s
      timeout: 5s
      start_period: 10m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Voice studio: try text, design / record / upload voices, and manage them. It also serves the voices
  # to the reader (the website proxies /tts-voices/ to its /voices/). Doesn't need the GPU.
  studio:
    build: ./studio
    image: tts-studio
    environment:
      BREEZE_URL: http://breeze-tts:7860
      # The path your web server serves the studio at. Set to "" to open it directly on port 7861.
      STUDIO_ROOT_PATH: ${STUDIO_ROOT_PATH:-/tts-studio}
    ports:
      - "7861:7861"
    volumes:
      # The voices (voices.json and the reference clips), kept in ./tts-voices on this machine.
      - ${TTS_VOICES_DIR:-./tts-voices}:/data/voices
    depends_on:
      - breeze-tts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7861/health"]
      interval: 30s
      timeout: 5s
